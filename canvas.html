<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Canvas · Project Graveyard</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .cv{max-width:1180px;margin:0 auto;padding:16px}
  .cv nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .cv nav a{color:inherit;text-decoration:none;font-weight:600}
  .cv h1{margin:0 0 4px}
  .note,.cv small{color:#666;font-size:13px}
  #status{min-height:22px;margin:8px 0;font-weight:600}
  #tray{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .chip{border:1px solid #ccc;border-radius:999px;padding:6px 12px;cursor:pointer;background:#fff;display:flex;flex-direction:column}
  .chip.on{border-color:#222;background:#f2f2f2}
  .top{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
  .pcard{background:#fff;border:1px solid #ccc;border-radius:12px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .pcard[data-drag]{cursor:grab;touch-action:none;user-select:none}
  .grip{font-size:12px;font-weight:700;color:#555;margin-bottom:8px;touch-action:none;cursor:grab}
  .grip[data-drag]{background:#f2f2f2;border-radius:8px;padding:8px}
  .pcard h3{margin:0 0 4px}
  .sample{font-size:11px;background:#eee;border-radius:6px;padding:2px 6px;margin-left:6px}
  .meta{font-size:13px;margin-bottom:8px}
  .bar{height:8px;background:#eee;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:#2e7d32}
  .pct{font-size:12px;margin:6px 0}
  .mini{margin:6px 0 0;padding-left:18px;font-size:13px}
  .lift{opacity:.4}
  .zones h4,.kh,.cv h4{margin:12px 0 6px}
  .zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .zgrid.paths5{grid-template-columns:repeat(5,1fr)}
  .zone{border:2px dashed #aaa;border-radius:12px;padding:10px;min-height:64px;background:#fafafa;transition:.15s}
  .zone b{display:block}
  .zone.sug{border-color:#2e7d32}
  .zone.cur{background:#e8f5e9;border-style:solid}
  .zone.live{border-color:#1565c0;background:#e3f2fd}
  .zone.hot{border-color:#e65100;background:#fff3e0;transform:scale(1.03)}
  .zone input{width:100%;margin-top:6px;box-sizing:border-box}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .col{min-height:140px}
  .col h4{display:flex;justify-content:space-between;margin:0 0 8px}
  .tcard{background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px;margin-bottom:8px;cursor:grab;touch-action:none;user-select:none}
  .tcard b{display:block;font-size:14px}
  .empty{padding:20px;text-align:center;color:#666}
  .ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;max-width:240px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  body.dragging{user-select:none;cursor:grabbing}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dgrid label{display:flex;flex-direction:column;font-size:12px;font-weight:600;gap:4px}
  .dgrid .wide{grid-column:1/-1}
  .dgrid input,.dgrid textarea,.dgrid select{font:inherit;padding:6px;border:1px solid #ccc;border-radius:6px}
  .draftwrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  .dz{display:grid;gap:10px}
  #scanMsg{font-size:12px;color:#444;margin-top:4px}
  @media(max-width:860px){.top,.draftwrap,.kanban{grid-template-columns:1fr}.zgrid.paths5{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="cv">
  <nav>
    <a href="index.html">Home</a>
    <a href="archive.html">Graveyard</a>
    <a href="canvas.html"><u>Canvas</u></a>
  </nav>
  <h1>The Canvas</h1>
  <p class="note">No buttons here. Drag a card into an Action Zone to act. Pick a project from the tray first.</p>
  <div id="status" role="status" aria-live="polite"></div>

  <div id="tray"></div>
  <div id="board"></div>

  <h4 class="kh">4 · Bury a new project: drag the draft handle into a zone</h4>
  <div class="draftwrap">
    <div id="draft"></div>
    <div class="dz">
      <div class="zone" data-zone="bury" data-accepts="draft"><b>Bury it</b><small>Adds this project to the graveyard</small></div>
      <div class="zone" data-zone="scan" data-accepts="draft"><b>Scan GitHub repo</b><small>Fills the fields from the repo</small><div id="scanMsg"></div></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/canvas.js"></script>
</body>
</html>
