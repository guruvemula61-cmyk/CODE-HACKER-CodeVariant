<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Graveyard · Project Graveyard</title>
<style>
  :root{--bg:#070b0a;--panel:#121a18;--line:#22302c;--text:#e8efec;--mute:#93a39d;--green:#34c796;--gold:#cfa851;--red:#e5726b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,rgba(52,199,150,.30),transparent 55%),radial-gradient(ellipse at 15% 85%,rgba(207,168,81,.12),transparent 45%),radial-gradient(ellipse at 85% 70%,rgba(52,199,150,.14),transparent 50%),#070b0a}
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:170px;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(255,255,255,.05) 70px 112px);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;background:rgba(7,11,10,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
  .logo{font-weight:800}.logo span{color:var(--green)}
  nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  nav a{padding:6px 12px;border-radius:999px;color:var(--mute);font-size:14px;font-weight:600}
  nav a:hover,nav a.on{color:var(--text);background:var(--panel)}
  nav a.canvas{background:var(--green);color:#06130e}
  .hero{padding:70px 0 30px}
  .kicker{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase}
  h1{font-size:clamp(36px,7vw,64px);line-height:1.05;margin:10px 0}
  .lead{color:var(--mute);font-size:18px;max-width:620px;margin:0}
  .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin:30px 0}
  .filters input,.filters select{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:60px}
  .stone{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:52px 20px 22px;cursor:pointer;transition:.2s;min-height:200px;opacity:0;transform:translateY(14px)}
  .stone.in{opacity:1;transform:none}
  .stone:hover,.stone:focus{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 10px 30px rgba(52,199,150,.15);outline:none}
  .tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:#0b1210;color:var(--gold)}
  .tag.revived{background:var(--green);color:#06130e;border-color:var(--green)}
  .tag.reviving{color:var(--green)}
  .tag.archived{color:var(--mute)}
  .stone h3{margin:0 0 4px;font-size:22px;line-height:1.2}
  .sample{font-size:11px;font-weight:600;border:1px dashed var(--mute);color:var(--mute);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .meta{color:var(--mute);font-size:14px}
  .bar{height:6px;background:#0b1210;border-radius:6px;overflow:hidden;margin:14px 0 4px}
  .bar i{display:block;height:100%;background:var(--green)}
  .pct{font-size:13px;color:var(--mute)}
  .reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
  .reveal>div{overflow:hidden}
  .stone:hover .reveal,.stone:focus .reveal{grid-template-rows:1fr}
  .reveal p{margin:8px 0 0;font-size:14px}
  .reveal b{color:var(--gold);font-weight:600;margin-right:4px}
  .empty{color:var(--mute);text-align:center;padding:40px 0}
  .btn{display:inline-block;padding:10px 18px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font:inherit;font-weight:700}
  .btn.em{background:var(--green);color:#06130e;border-color:var(--green)}
  .btn.ghost:hover{background:var(--panel)}
  .btn.sm{padding:7px 14px;font-size:14px}
  .note{color:var(--mute);font-size:13px}
  dialog#detail{width:min(880px,94vw);max-height:90vh;padding:0;border:1px solid var(--line);border-radius:20px;background:#0d1412;color:var(--text)}
  dialog#detail::backdrop{background:rgba(0,0,0,.7)}
  .dwrap{padding:26px}
  .dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .dhead h3{margin:0;font-size:28px}
  .x{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;width:36px;height:36px;font-size:22px;cursor:pointer}
  .blk{margin-top:22px}
  .blk h4{margin:0 0 8px;color:var(--gold)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chk{margin:0;padding:0;list-style:none}
  .chk li{padding:4px 0 4px 22px;position:relative;font-size:14px}
  .chk.ok li::before{content:"✓";position:absolute;left:0;color:var(--green)}
  .chk.no li::before{content:"○";position:absolute;left:0;color:var(--gold)}
  .find{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .ev{flex:none;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;height:fit-content;border:1px solid var(--line)}
  .ev.y{color:var(--green)}.ev.n{color:var(--red)}.ev.u{color:var(--mute)}
  .paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .path{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .path h5{margin:0 0 4px;font-size:16px}
  .path p{margin:0;color:var(--mute);font-size:13px}
  .path.top{border-color:var(--green)}
  .path.chosen{background:#10231d}
  .task{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .task.done .tt{text-decoration:line-through;color:var(--mute)}
  .pr{color:var(--mute);font-size:12px}
  .tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
  .tl li{padding:4px 0 8px 12px;font-size:14px}
  .tl small{display:block;color:var(--mute)}
  .acts{display:flex;gap:10px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--green);color:#06130e;font-weight:700;padding:10px 20px;border-radius:12px;z-index:100}
  @media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.cols{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">Project <span>Graveyard</span></a>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a class="on" href="graveyard.html">Graveyard</a>
      <a href="lab.html">Lab</a>
      <a href="revivers.html">Co-revivers</a>
      <a href="stories.html">Stories</a>
      <a class="canvas" href="canvas.html">Open the Canvas</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div class="kicker">Project Graveyard</div>
    <h1>The Graveyard</h1>
    <p class="lead">Every project you gave up on, with the reason it stopped. Open one to see its autopsy and decide what happens next.</p>
  </div>

  <div class="filters">
    <input id="q" type="search" placeholder="Search name, language, category, stack" aria-label="Search">
    <select id="fLang" aria-label="Language"></select>
    <select id="fReason" aria-label="Reason"></select>
    <select id="fSort" aria-label="Sort">
      <option value="new">Last active: newest</option>
      <option value="old">Last active: oldest</option>
      <option value="done">Most complete</option>
    </select>
  </div>

  <div id="grid"></div>
  <p id="empty" class="empty" hidden>No projects match. Try clearing the filters, or bury one in the Canvas.</p>
</main>

<dialog id="detail" aria-label="Project details"></dialog>

<script src="js/app.js"></script>
</body>
</html>
